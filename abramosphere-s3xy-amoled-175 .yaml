# ·············································
script:
  - id: publish_current_time
    then:
      - lambda: |-
          // Publish current time
          auto time_now = id(homeassistant_time).now();
          id(current_time).publish_state(time_now.strftime("%H:%M"));

  - id: check_alarm
    then:
      - lambda: |-
          id(publish_current_time).execute();
          // Check alarm
          if (id(alarm_on).state && id(alarm_time).has_state()) {
            // Get the stored alarm time from the sensor
            auto set_alarm_time = id(alarm_time).state;
            if (set_alarm_time.length() == 5 &&
              isdigit(set_alarm_time[0]) && isdigit(set_alarm_time[1]) &&
              isdigit(set_alarm_time[3]) && isdigit(set_alarm_time[4])) {
              auto alarm_hour = std::stoi(set_alarm_time.substr(0, 2));
              auto alarm_minute = std::stoi(set_alarm_time.substr(3, 2));

              // Trigger action if current time matches alarm time
              auto time_now = id(homeassistant_time).now();
              if (time_now.hour == alarm_hour && time_now.minute == alarm_minute) {
                auto action = id(alarm_action).current_option();
                if (action == "Play sound") {
                  id(timer_ringing).turn_on();
                } else if (action == "Send event") {
                  id(send_alarm_event).execute();
                } else if (action == "Sound and event") {
                  id(timer_ringing).turn_on();
                  id(send_alarm_event).execute();
                } 
              }
            } else {
              ESP_LOGW("alarm", "Incorrect alarm time setting");
            }
          }

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing

  - id: time_update
    then:
      - lvgl.indicator.update:
          id: minute_hand
          value: !lambda |-
            return id(homeassistant_time).now().minute;
      - lvgl.indicator.update:
          id: hour_hand
          value: !lambda |-
            auto now = id(homeassistant_time).now();
            return std::fmod(now.hour, 12) * 60 + now.minute;
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            static const char * const mon_names[] = {"JAN", "FEB", "MAR", "APR", "MAY", "JUN",
                                                     "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"};
            static char date_buf[8];
            auto now = id(homeassistant_time).now();
            snprintf(date_buf, sizeof(date_buf), "%s %2d", mon_names[now.month-1], now.day_of_month);
            return date_buf;
      - lvgl.label.update:
          id: day_label
          text: !lambda |-
            static const char * const day_names[] = {"SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"};
            return day_names[id(homeassistant_time).now().day_of_week - 1];
# ········································································································
# :   ____            _       _             ____                       ____  _           _               :
# :  / ___|  ___ _ __(_)_ __ | |_          |  _ \ _ __ __ ___      __ |  _ \(_)___ _ __ | | __ _ _   _   :
# :  \___ \ / __| '__| | '_ \| __|  _____  | | | | '__/ _` \ \ /\ / / | | | | / __| '_ \| |/ _` | | | |  :
# :   ___) | (__| |  | | |_) | |_  |_____| | |_| | | | (_| |\ V  V /  | |_| | \__ \ |_) | | (_| | |_| |  :
# :  |____/ \___|_|  |_| .__/ \__|         |____/|_|  \__,_| \_/\_/   |____/|_|___/ .__/|_|\__,_|\__, |  :
# :                    |_|                                                        |_|            |___/   :
# ········································································································
  - id: draw_display
    then:
      - lambda: |
          id(check_if_timers_active).execute();
          if (id(is_timer_active)){
            id(fetch_first_active_timer).execute();
          }
          if(id(init_in_progress)) {
            //During Init window, only display startup screen.
            id(draw_display_initializing).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_noWifi_phase_id}) {
            //Outside of init window, draw no wifi screen
            id(draw_display_no_wifi_connection_state).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_noHA_phase_id}) {
            //Outside of init window, draw no HA connection screen
            id(draw_display_no_ha_connection_state).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_noVA_phase_id}) {
            //Outside of init window, draw no HA connection screen
            id(draw_display_no_va_connection_state).execute(); 
          } else if (id(timer_ringing).state) {
            id(draw_display_timer_ringing).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) {
            id(draw_display_voice_assistant_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) {
            id(draw_display_voice_assistant_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) {
            id(draw_display_voice_assistant_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
            id(draw_display_voice_assistant_replying_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
            id(draw_display_voice_assistant_error_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) {
            id(draw_display_voice_assistant_not_ready_phase).execute();
          } else if (id(is_timer_active)) {
            id(draw_display_timer_ticking).execute();
          } else if (id(alarm_on).state) {
            id(draw_display_alarm_active).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(draw_display_voice_assistant_idle_phase).execute();
          }

  # Script executed during Improv BLE
  # Warm White slow pulse
  - id: draw_display_initializing
    then:
      - lvgl.page.show: Startup
      # - component.update: main_display

  # Script executed when the device has no Wifi connection after initial init period      
  - id: draw_display_no_wifi_connection_state
    then:
      - lvgl.page.show: No_Wifi
      - component.update: main_display   

  # Script executed when the device has no connection to Home Assistant
  # Red slow pulse (This will be visible during HA updates for example)
  - id: draw_display_no_ha_connection_state
    then:
      - lvgl.page.show: No_HA
      - component.update: main_display

  # Script executed when the device has no connection to Home Assistant
  # Red slow pulse (This will be visible during HA updates for example)
  - id: draw_display_no_va_connection_state
    then:
      - lvgl.page.show: No_HA
      - component.update: main_display

  # Script executed when the timer is ringing, to control the LEDs
  # The LED blinks green.
  - id: draw_display_timer_ringing
    then:
      - lvgl.page.show: VA_Timer
      - component.update: main_display

  # Script executed when the timer is ticking, to control the LEDs
  # Slow dim while pulse.
  # Need to create a page for this
  - id: draw_display_timer_ticking
    then:

  # Script executed when the alarm is active
  # The LED turns on dim green
  # Page needs created for this
  - id: draw_display_alarm_active
    then:

  # Script executed when the voice assistant is idle (waiting for a wake word)
  # Display Idle Page
  - id: draw_display_voice_assistant_idle_phase
    then:
      - logger.log: "Show Clock"
      - lvgl.page.show: clock_page
      - component.update: main_display

  # Script executed when the voice assistant is waiting for a command (After the wake word)
  # Display Listening Page
  - id: draw_display_voice_assistant_waiting_for_command_phase
    then:
      - lvgl.page.show: VA_Listening
      - component.update: main_display

  # Script executed when the voice assistant is listening to a command
  # Display Listening Page
  - id: draw_display_voice_assistant_listening_for_command_phase
    then:
      - lvgl.page.show: VA_Listening
      - component.update: main_display

  # Script executed when the voice assistant is thinking to a command
  # Fast purple pulse
  - id: draw_display_voice_assistant_thinking_phase
    then:
      - lvgl.page.show: VA_Thinking
      - component.update: main_display

  # Script executed when the voice assistant is replying to a command
  # Slow cyan pulse
  - id: draw_display_voice_assistant_replying_phase
    then:
      - lvgl.page.show: VA_Replying
      - component.update: main_display

  # Script executed when the voice assistant is in error
  # Fast Red Pulse
  - id: draw_display_voice_assistant_error_phase
    then:
      - lvgl.page.show: VA_Error
      - component.update: main_display

  # Script executed when the voice assistant is not ready
  - id: draw_display_voice_assistant_not_ready_phase
    then:
      - lvgl.page.show: VA_Error
      - component.update: main_display

