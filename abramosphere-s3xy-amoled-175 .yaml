interval:
  # Tight intervel to make responsive.  Return ASAP if no work.
  - interval: .5s
    then:
      # Check if the current phase is not equal to the previous runs phase.
      - if: 
          condition:
            lambda: return (id(previous_phase)!=id(voice_assistant_phase));
          then:
            - logger.log:
                format: STATE CHANGED FROM %d TO %d
                args: [id(previous_phase), id(voice_assistant_phase)]
                level: info
            - script.execute: draw_display
            - lambda: id(previous_phase) = id(voice_assistant_phase);

