i2c:
  - id: bus_a
    scl: GPIO14
    sda: GPIO15
    scan: false

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: 
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO42

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000

audio_adc:
  - platform: es7210
    i2c_id: bus_a
    id: es7210_adc
    address: 0x40
    mic_gain: 30db  # Increased for better sensitivity
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_audio_bus
    sample_rate: 16000
    i2s_din_pin: GPIO10
    bits_per_sample: 16bit
    adc_type: external
    pdm: false  # Ensure we're using standard I2S, not PDM
    use_apll: false  # Disable APLL to reduce I2S conflicts

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO8
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 64ms
    use_apll: false  # Disable APLL to reduce I2S conflicts

  # Virtual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_box_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 16000
    bits_per_sample: 16
    num_channels: 2

  - platform: resampler
    id: media_box_speaker
    output_speaker: media_mixing_input
    sample_rate: 16000
    bits_per_sample: 16
    num_channels: 2

  - platform: resampler
    id: sendspin_box_speaker
    output_speaker: sendspin_mixing_input
    sample_rate: 16000
    bits_per_sample: 16
    num_channels: 2

  - platform: mixer
    id: mixing_speaker
    output_speaker: box_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
      - id: sendspin_mixing_input
        timeout: never




# ································································
