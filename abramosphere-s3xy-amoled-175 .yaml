# QSPI configuration for 1.75" AMOLED display
spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

# CST9217/FT3168 touchscreen configuration
touchscreen:
  - platform: cst9217
    display: main_display
    id: my_touchscreen
    i2c_id: bus_a
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true
    # on_touch:
    #   then:
    #     - logger.log:
    #         format: Touch %d at (%d, %d)
    #         args: [touch.id, touch.x, touch.y]
    #         level: info

# 1.75" Round AMOLED Display Configuration (466x466 with CO5300 Driver)

# Display Configuration
# https://github.com/STB3/esphome-Viewe_UEDX4646/blob/master/viewe-uedx46460015-example.yaml
display:
  - platform: mipi_spi
    id: main_display
    model: CO5300
    bus_mode: quad
    reset_pin: GPIO39
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_height: 0
      offset_width: 6  # UE015WV-RB24-A021A has 6-pixel horizontal offset
    update_interval: never
    color_depth: 16
    buffer_size: 100%  # Full buffer for smooth rendering

    # Display initialization sequence
    init_sequence:
      - [ 0xD0, 0x07, 0x42, 0x18]  # Gamma correction positive
      - delay 10ms
      - [ 0xD1, 0x00, 0x07, 0x10]  # Gamma correction negative
      - delay 10ms

lvgl:
  displays:
    - main_display 
  touchscreens: 
    - my_touchscreen 


