switch:
  - platform: gpio
    pin: 
      number: GPIO46
      ignore_strapping_warning: true
    id: amp_enable
    name: "Speaker Amplifier Enable"
    icon: "mdi:volume-high"
    entity_category: config
    restore_mode: ALWAYS_ON
    internal: false

  # Button click Sounds Switch.
  - platform: template
    id: button_sound
    name: Button click sounds
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # software speaker mute
  - platform: template
    id: speaker_mute_switch
    name: Speaker mute
    icon: mdi:volume-mute
    internal: true
    optimistic: true
    turn_on_action:
      - speaker.mute_on:
          id: box_speaker
    turn_off_action: 
      - speaker.mute_off:
          id: box_speaker

  # stateless momentary mic mute switch
  - platform: gpio
    internal: true
    pin: 
      number: GPIO0 
      ignore_strapping_warning: true
      inverted: true
    id: mute_toggle
    on_turn_on:
      - delay: 300ms
      - switch.turn_off: mute_toggle

  # added mute state internal switch to replace the respeaker drivers
  - platform: template
    id: mute_state
    name: Speaker mute
    icon: mdi:volume-mute
    internal: true
    optimistic: true

  # stateful user facing mic mute switch
  - platform: template
    id: mic_mute_switch
    name: Mic mute
    icon: mdi:microphone-off
    optimistic: false
    lambda: |-
      if (id(mute_state).state) {
        return true;
      } else {
        return false;
      }
    on_turn_on:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_on_sound"
    on_turn_off:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_on: mute_sound
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_off_sound"
    turn_on_action:
      - if:
          condition:
            lambda: return !id(mute_state).state;
          then:
            - switch.turn_on: mute_toggle
    turn_off_action:
      - if:
          condition:
            lambda: return id(mute_state).state;
          then:
            - switch.turn_on: mute_toggle

