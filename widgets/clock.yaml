substitutions:
  font_family: Figtree
  font_glyphsets: GF_Latin_Core

font:
  - file:
      type: gfonts
      family: ${font_family}
      weight: 300
      italic: true
    id: font_request
    size: 15
    glyphsets:
      - ${font_glyphsets}
  - file:
      type: gfonts
      family: ${font_family}
      weight: 300
    id: font_responcse
    size: 45
    glyphsets:
      - ${font_glyphsets}
  - file:
      type: gfonts
      family: ${font_family}
      weight: 300
    id: font_timer
    size: 16
    glyphsets:
      - ${font_glyphsets}

lvgl:
    pages:
    - id: clock_page
      on_swipe_right:
        - lvgl.page.next:        
      on_swipe_left:
        - lvgl.page.previous:
      widgets:
          - obj:
              height: 470
              width: 470
              align: center
              pad_all: 4
              bg_color: Black
              border_width: 0  
              widgets:
              - label:
                  id: day_label
                  align: Center
                  text_color: Red
                  text_align: Center
                  text_font: font_responcse
                  y: -50
              - label:
                  id: date_label
                  align: Center
                  text_color: Red
                  text_align: Center
                  text_font: font_responcse
                  y: 50
              - meter:
                  height: 100%
                  width: 100%
                  align: center
                  bg_color: Black
                  bg_opa: TRANSP 
                  scales:
                    # Minor ticks
                    - ticks:
                        width: 2
                        count: 61
                        length: 10
                        color: White
                      range_from: 0
                      range_to: 60
                      angle_range: 360
                      rotation: 270

                      # Minuite hand
                      indicators:
                        - line:
                            id: minute_hand
                            width: 3
                            color: White
                            r_mod: -1
                    # Major ticks
                    - angle_range: 330
                      rotation: 300
                      range_from: 1
                      range_to: 12
                      ticks:
                        width: 3
                        count: 12
                        length: 20
                        color: Red                       

                    # Hour hand
                    - angle_range: 360
                      rotation: 270
                      range_from: 0
                      range_to: 720
                      indicators:
                        - line:
                            id: hour_hand
                            width: 4
                            color: White
                            r_mod: -40