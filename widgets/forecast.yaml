interval:
  - interval: 2h
    startup_delay: 30s
    then:
      - wait_until:
          api.connected:
      - logger.log: "Preparing to fetch weather forcast"
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: weather.openweathermap
            type: daily
          capture_response: true
          on_success:
            - logger.log: "parsing weather forcast"
            - lambda: |-
                struct tm tm_day; //2026-02-05T17:00:00+00:00
                char buff[7];

                JsonObjectConst JSONDay = response["response"]["weather.openweathermap"]["forecast"][1];
                strptime(JSONDay["datetime"].as<std::string>().c_str(), "%Y-%m-%dT%H:%M:%S+00:00", &tm_day);
                strftime(buff, sizeof buff, "%d\n%a" , &tm_day);
                id(day1_date) = std::string(buff);
                id(day1_cond) = id(forcast_icon_map)[JSONDay["condition"].as<std::string>()];
                id(day1_high) = JSONDay["temperature"].as<int>();
                id(day1_low)  = JSONDay["templow"].as<int>();

                JSONDay = response["response"]["weather.openweathermap"]["forecast"][2];
                strptime(JSONDay["datetime"].as<std::string>().c_str(), "%Y-%m-%dT%H:%M:%S+00:00", &tm_day);
                strftime(buff, sizeof buff, "%d\n%a" , &tm_day);
                id(day2_date) = std::string(buff);
                id(day2_cond) = id(forcast_icon_map)[JSONDay["condition"].as<std::string>()];
                id(day2_high) = JSONDay["temperature"].as<int>();
                id(day2_low)  = JSONDay["templow"].as<int>();

                JSONDay = response["response"]["weather.openweathermap"]["forecast"][3];
                                strptime(JSONDay["datetime"].as<std::string>().c_str(), "%Y-%m-%dT%H:%M:%S+00:00", &tm_day);
                strftime(buff, sizeof buff, "%d\n%a" , &tm_day);
                id(day3_date) = std::string(buff);
                id(day3_cond) = id(forcast_icon_map)[JSONDay["condition"].as<std::string>()];
                id(day3_high) = JSONDay["temperature"].as<int>();
                id(day3_low)  = JSONDay["templow"].as<int>();

                JSONDay = response["response"]["weather.openweathermap"]["forecast"][4];
                                strptime(JSONDay["datetime"].as<std::string>().c_str(), "%Y-%m-%dT%H:%M:%S+00:00", &tm_day);
                strftime(buff, sizeof buff, "%d\n%a" , &tm_day);
                id(day4_date) = std::string(buff);
                id(day4_cond) = id(forcast_icon_map)[JSONDay["condition"].as<std::string>()];
                id(day4_high) = JSONDay["temperature"].as<int>();
                id(day4_low)  = JSONDay["templow"].as<int>();

                JSONDay = response["response"]["weather.openweathermap"]["forecast"][5];
                                strptime(JSONDay["datetime"].as<std::string>().c_str(), "%Y-%m-%dT%H:%M:%S+00:00", &tm_day);
                strftime(buff, sizeof buff, "%d\n%a" , &tm_day);
                id(day5_date) = std::string(buff);
                id(day5_cond) = id(forcast_icon_map)[JSONDay["condition"].as<std::string>()];
                id(day5_high) = JSONDay["temperature"].as<int>();
                id(day5_low)  = JSONDay["templow"].as<int>();
            - logger.log: "weather forcast fetch complete"
            - lvgl.bar.update:
                id: day1_bar
                mode: RANGE
                indicator:
                  bg_color: !lambda |-
                    int temp = id(day1_high);
                    if (temp < 40) return lv_color_hex(0x4D93DD);
                    if (temp < 50) return lv_color_hex(0x4BDCE3);
                    if (temp < 60) return lv_color_hex(0xA1EDDE);
                    if (temp < 70) return lv_color_hex(0xEFF2B1);
                    if (temp < 80) return lv_color_hex(0xFFD512);
                    return lv_color_hex(0xF53B3B);
                value: !lambda 'return id(day1_high);'
                start_value: !lambda 'return id(day1_low);'
            - lvgl.bar.update:
                id: day2_bar
                mode: RANGE
                indicator:
                  bg_color: !lambda |-
                    int temp = id(day2_high);
                    if (temp < 40) return lv_color_hex(0x4D93DD);
                    if (temp < 50) return lv_color_hex(0x4BDCE3);
                    if (temp < 60) return lv_color_hex(0xA1EDDE);
                    if (temp < 70) return lv_color_hex(0xEFF2B1);
                    if (temp < 80) return lv_color_hex(0xFFD512);
                    return lv_color_hex(0xF53B3B);
                value: !lambda 'return id(day2_high);'
                start_value: !lambda 'return id(day2_low);'
            - lvgl.bar.update:
                id: day3_bar
                mode: RANGE
                indicator:
                  bg_color: !lambda |-
                    int temp = id(day3_high);
                    if (temp < 40) return lv_color_hex(0x4D93DD);
                    if (temp < 50) return lv_color_hex(0x4BDCE3);
                    if (temp < 60) return lv_color_hex(0xA1EDDE);
                    if (temp < 70) return lv_color_hex(0xEFF2B1);
                    if (temp < 80) return lv_color_hex(0xFFD512);
                    return lv_color_hex(0xF53B3B);
                value: !lambda 'return id(day3_high);'
                start_value: !lambda 'return id(day3_low);' 
            - lvgl.bar.update:
                id: day4_bar
                mode: RANGE
                indicator:
                  bg_color: !lambda |-
                    int temp = id(day4_high);
                    if (temp < 40) return lv_color_hex(0x4D93DD);
                    if (temp < 50) return lv_color_hex(0x4BDCE3);
                    if (temp < 60) return lv_color_hex(0xA1EDDE);
                    if (temp < 70) return lv_color_hex(0xEFF2B1);
                    if (temp < 80) return lv_color_hex(0xFFD512);
                    return lv_color_hex(0xF53B3B);
                value: !lambda 'return id(day4_high);'
                start_value: !lambda 'return id(day4_low);'  
            - lvgl.bar.update:
                id: day5_bar
                mode: RANGE
                indicator:
                  bg_color: !lambda |-
                    int temp = id(day5_high);
                    if (temp < 40) return lv_color_hex(0x4D93DD);
                    if (temp < 50) return lv_color_hex(0x4BDCE3);
                    if (temp < 60) return lv_color_hex(0xA1EDDE);
                    if (temp < 70) return lv_color_hex(0xEFF2B1);
                    if (temp < 80) return lv_color_hex(0xFFD512);
                    return lv_color_hex(0xF53B3B);
                value: !lambda 'return id(day5_high);'
                start_value: !lambda 'return id(day5_low);'
            - lvgl.label.update:
                id: day1_icon
                text: !lambda 'return id(day1_cond).c_str();'
            - lvgl.label.update:
                id: day2_icon
                text: !lambda 'return id(day2_cond).c_str();'
            - lvgl.label.update:
                id: day3_icon
                text: !lambda 'return id(day3_cond).c_str();'
            - lvgl.label.update:
                id: day4_icon
                text: !lambda 'return id(day4_cond).c_str();'
            - lvgl.label.update:
                id: day5_icon
                text: !lambda 'return id(day5_cond).c_str();'
            - lvgl.label.update:
                id: day1_date_lvgl
                text: !lambda 'return id(day1_date).c_str();'
            - lvgl.label.update:
                id: day2_date_lvgl
                text: !lambda 'return id(day2_date).c_str();'
            - lvgl.label.update:
                id: day3_date_lvgl
                text: !lambda 'return id(day3_date).c_str();'
            - lvgl.label.update:
                id: day4_date_lvgl
                text: !lambda 'return id(day4_date).c_str();'
            - lvgl.label.update:
                id: day5_date_lvgl
                text: !lambda 'return id(day5_date).c_str();'
            - logger.log: "Forecast Rendered"

